{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

<body>

    <a class="navbar-brand" href="#">My website</a>

      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'user_home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'profile' %}">Profile</a>
        </li>
        <li class="nav-item dropdown">

            Dropdown
          </a> -->
           <li class="nav-item">
          <a class="nav-link" href="{% url 'view_books' %}">Books</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'common_logout' %}">Logout</a>
        </li>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>

            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>

      <form class="d-flex" role="search">

      </form>
    </div>
  </div>
</nav>
    <h1 class="text-primary">Home</h1>
    <div class="container">
        <div class="row">
            {% for i in books %}
             <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <div class="card-title">
                            <h2>{{i.bookname}}</h2>
                        </div>
                        <img src="{{i.photo.url}}" alt="" width="200" height="100">
                        <div class="card-title">
                            <h2 class="text-damage mt-3">Price :{{i.price}}</h2>
                        </div>
                         <div class="card-title">
                            <h4 class="text-dark mt-3"><strong>Written By:{{i.author}}</h4>
                    </div>
                </div>
             </div>
            {% endfor %}
        </div>
    </div>
